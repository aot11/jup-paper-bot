name: tick
# Un tick du bot paper-trading toutes les 5 minutes.
# Repo public volontairement : aucune donnée sensible (simulation, aucune clé),
# et les minutes Actions sont gratuites en illimité sur les dépôts publics.

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub peut décaler de quelques minutes, c'est OK
  workflow_dispatch: {}      # bouton manuel pour tester

permissions:
  contents: write            # pour committer state.json à la fin du tick

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tick (sorties + entrée éventuelle)
        run: python bot.py once

      - name: Commit de l'état
        run: |
          git config user.name  "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add state.json trades.jsonl
          git diff --cached --quiet || git commit -m "tick $(date -u +%FT%TZ)"
          git push
